name: UltimateBot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ultimate-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Session
        env:
          KEY: ${{ secrets.SESSION_KEY }}
        run: |
          echo "$KEY" | openssl enc -aes-256-cbc -d -salt -pbkdf2 -in session.enc -out session.tar.gz -pass stdin
          tar -xzf session.tar.gz
          rm -f session.tar.gz

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Bot
        run: timeout 20000 npm start || true

      - name: Save Database
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add database.json || true
          git commit -m "Update Database [skip ci]" || true
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git push origin main || true

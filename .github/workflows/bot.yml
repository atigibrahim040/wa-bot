name: AlyaBot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: alya-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Session
        env:
          KEY: ${{ secrets.SESSION_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No key"; exit 1; fi
          echo "$KEY" | openssl enc -aes-256-cbc -d -salt -pbkdf2 -in session.enc -out session.tar.gz -pass stdin
          tar -xzf session.tar.gz
          mv session AlyaBot-Session
          rm -f session.tar.gz
          echo "Session files: $(ls AlyaBot-Session/ | wc -l)"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Bot
        env:
          BOT_OWNER: ${{ secrets.BOT_OWNER }}
        run: timeout 20000 node index.js || true

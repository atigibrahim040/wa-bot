name: HIROBOT

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: hiro-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Session
        env:
          KEY: ${{ secrets.SESSION_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No key provided"; exit 1; fi
          # فك تشفير الجلسة
          echo "$KEY" | openssl enc -aes-256-cbc -d -salt -pbkdf2 -in session.enc -out session.tar.gz -pass stdin
          tar -xzf session.tar.gz
          rm -f session.tar.gz
          
          # تجهيز مجلد الجلسات الخاص بـ HIROBOT
          mkdir -p data/sessions
          mv auth_info_baileys data/sessions/main 2>/dev/null || true
          echo "Session files: $(ls data/sessions/ | wc -l)"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Bot
        env:
          BOT_OWNER: ${{ secrets.BOT_OWNER }}
        run: timeout 20000 node index.js || true
